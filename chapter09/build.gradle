plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
}

description 'Chapter 09: Spring Transaction Management!'

// we are using Spring Boot dependency management, but we configure Spring MVC in the classic manner - explicitly, with no Spring Boot "magic"
dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.0'
    }
    // Spring Boot's BOM pins commons-lang3 to 3.12.0, but Testcontainers pulls in
    // commons-compress 1.28.0 which needs commons-lang3 3.13+ (ArrayFill). Override
    // the BOM-managed version so the testcontainers classpath doesn't blow up with a
    // NoClassDefFoundError at container startup.
}

dependencies {
    implementation 'org.springframework:spring-orm'
    implementation 'org.springframework:spring-context'

    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    implementation "ch.qos.logback:logback-classic:$logbackVersion"
    implementation "jakarta.annotation:jakarta.annotation-api:$jakartaAnnotationVersion"

    implementation "com.zaxxer:HikariCP:$hikariVersion"
    implementation "org.mariadb.jdbc:mariadb-java-client:$mariadbClientVersion"
    // pinned above the root project's hibernateVersion (6.2.6.Final): Spring
    // Framework 7 / Jakarta Persistence 3.2 need Hibernate ORM 7.x, otherwise
    // building the EntityManagerFactory fails with a SchemaManager signature clash
    implementation 'org.hibernate.orm:hibernate-core:7.4.0.Final'

    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.testcontainers:mariadb:$testcontainersVersion"
    testImplementation "org.testcontainers:junit-jupiter:$testcontainersVersion"
}

tasks.register('fatJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    /*  Gradle Fat jars with multiple dependencies are affected by the same bug: https://issues.apache.org/jira/browse/MASSEMBLY-360 this statement fixes it */
    manifest {
        attributes "Main-Class": "com.apress.prospring6.nine.Chapter9Demo",
                "Created-By": "Iuliana Cosmina",
                "Specification-Title": "Pro Spring 6 - Chapter 9"
    }
    from {configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}