plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework:spring-context:7.0.8'
    implementation 'org.springframework:spring-core:7.0.8'
    implementation project(':chapter02')
    implementation 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.springframework:spring-test:6.1.14'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'

    implementation libs.guava
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = project.hasProperty("main") ? project.getProperty("main") : "com.apress.prospring6.two.HelloWorld"
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('run', JavaExec) {
    if (project.hasProperty('jvmArgs')) {
        jvmArgs project.property('jvmArgs').split('\\s+')
    }
}
