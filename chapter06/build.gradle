plugins {
    id 'java'
}

group = 'com.apress.prospring6'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework:spring-context:7.0.8'
    implementation 'org.springframework:spring-core:7.0.8'
    implementation 'org.springframework:spring-jdbc:7.0.8'

    implementation 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.1'
    implementation 'org.apache.commons:commons-dbcp2:2.13.0'

    testImplementation libs.junit.jupiter
    testImplementation 'org.springframework:spring-test:7.0.8'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
