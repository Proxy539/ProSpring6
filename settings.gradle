// Modules from later chapters of the book are added incrementally as their
// directories are scaffolded. Add the corresponding `include` line here
// (and it will pick up the module's standard `build.gradle`) once a chapter
// directory exists in the repo.

println(' This project is a collection of simple code samples. It is meant to be used together with the ' +
        '"Pro Spring 6"  book' +
        ' published by Apress in order to learn and practice Spring.')

//we check if the modules have gradle configuration files
rootProject.children.each { project ->
    assert project.projectDir.isDirectory()
    assert project.buildFile.exists()
    assert project.buildFile.isFile()
}