plugins {
    id 'war'
    id 'io.spring.dependency-management' version '1.1.7'
}

description 'Chapter 14: Spring MVC Thymeleaf'

// we are using Spring Boot dependency management, but we configure Spring MVC in the classic manner - explicitly, with no Spring Boot "magic"
dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.0'
    }
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation "org.thymeleaf.extras:thymeleaf-extras-java8time:3.0.4.RELEASE"

    implementation "org.glassfish:jakarta.el:5.0.0-M1"

    // no explicit version - the root build.gradle's $logbackVersion (1.4.8) predates
    // Spring Boot 4.1's BOM-managed logback (1.5.34) and would override it, breaking
    // Boot's logging bootstrap (see chapter13's build.gradle for the same note).
    implementation "ch.qos.logback:logback-classic"
    implementation "jakarta.annotation:jakarta.annotation-api:$jakartaAnnotationVersion"

    implementation "com.zaxxer:HikariCP:$hikariVersion"
    runtimeOnly "org.mariadb.jdbc:mariadb-java-client:$mariadbClientVersion"

    compileOnly "jakarta.servlet:jakarta.servlet-api:$servletApiVersion"

    implementation "commons-io:commons-io:2.11.0"

    testImplementation 'org.springframework:spring-test'
    testImplementation "jakarta.servlet:jakarta.servlet-api:$servletApiVersion"
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.testcontainers:mariadb:$testcontainersVersion"
    testImplementation "org.testcontainers:junit-jupiter:$testcontainersVersion"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spring Boot 4.1 split TestRestTemplate/@AutoConfigureMockMvc out of spring-boot-starter-test into
    // dedicated modules. Depend on those two directly rather than the 'spring-boot-starter-test-classic'
    // umbrella, which also drags in spring-boot-security-test - its @AutoConfigureMockMvc auto-configuration
    // imports reference spring-security classes that aren't on this module's classpath (we don't use
    // Spring Security here), breaking context startup for any test using @AutoConfigureMockMvc.
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    // TestRestTemplateTestAutoConfiguration's bean-type deduction needs RestTemplateBuilder on the
    // classpath even though nothing here calls it directly.
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testRuntimeOnly 'org.springframework.boot:spring-boot-starter-tomcat'
    testRuntimeOnly 'com.h2database:h2'
}

// Scaffolded only, like chapter06 before it - no src/ yet. Fill in the Spring MVC +
// Thymeleaf demo classes (config, controllers, templates) as this chapter's examples
// are added. Start MariaDB first: build/run the image in docker-build/ (see its
// Dockerfile) and point the app's DataSource at localhost:3306/musicdb.
tasks.register('fatWar', War) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    /*  Gradle Fat jars with multiple dependencies are affected by the same bug: https://issues.apache.org/jira/browse/MASSEMBLY-360 this statement fixes it */
    manifest {
        attributes "Created-By": "Iuliana Cosmina",
                "Specification-Title": "Pro Spring 6 - Chapter 14"
    }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with war
}
