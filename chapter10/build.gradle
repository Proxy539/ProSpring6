plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
}

description 'Chapter 10: Spring Data JPA!'

// we are using Spring Boot dependency management, but we configure Spring Data JPA in the classic manner - explicitly, with no Spring Boot "magic"
dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.0'
    }
}

dependencies {
    implementation 'org.springframework:spring-orm'
    implementation 'org.springframework:spring-context'
    // DataJpaCfg's @ComponentScan picks up AuditCfg (and its @EnableJpaAuditing) even
    // when a test only imports DataJpaCfg directly; @EnableJpaAuditing needs
    // AnnotationBeanConfigurerAspect from spring-aspects on the classpath to register
    implementation 'org.springframework:spring-aspects'

    // pulls in spring-data-jpa and hibernate-envers transitively, all pinned by the
    // Boot BOM's spring-data-bom import so they line up with the hibernate-core
    // version the BOM manages (needed for Jakarta Persistence 3.2 / Hibernate ORM 7.x)
    implementation 'org.springframework.data:spring-data-envers'

    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    // deliberately unversioned: the Boot BOM pins logback-classic/logback-core to the
    // same release (1.5.x) - the root project's older $logbackVersion (1.4.8) only
    // upgrades logback-core via the BOM, leaving a binary-incompatible logback-classic/
    // logback-core pair that blows up at first Logger init with a NoClassDefFoundError
    implementation 'ch.qos.logback:logback-classic'
    implementation "jakarta.annotation:jakarta.annotation-api:$jakartaAnnotationVersion"

    implementation "com.zaxxer:HikariCP:$hikariVersion"
    implementation "org.mariadb.jdbc:mariadb-java-client:$mariadbClientVersion"

    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.testcontainers:mariadb:$testcontainersVersion"
    testImplementation "org.testcontainers:junit-jupiter:$testcontainersVersion"
}

tasks.register('fatJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    /*  Gradle Fat jars with multiple dependencies are affected by the same bug: https://issues.apache.org/jira/browse/MASSEMBLY-360 this statement fixes it */
    manifest {
        attributes "Main-Class": "com.apress.prospring6.ten.Chapter10Demo",
                "Created-By": "Iuliana Cosmina",
                "Specification-Title": "Pro Spring 6 - Chapter 10"
    }
    from {configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}
