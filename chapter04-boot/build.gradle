plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.apress.prospring6'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

    implementation project(':chapter02')

    implementation 'org.springframework.boot:spring-boot-starter'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// This module has two independent @SpringBootApplication demo classes, so Boot can't
// auto-detect a single main class. Default to one; override with -Pmain=<fqcn>, e.g.
// ./gradlew :chapter04-boot:bootRun -Pmain=com.apress.prospgin6.four.runners.WithRunnersApplication
springBoot {
    mainClass = project.hasProperty("main") ? project.getProperty("main") : "com.apress.prospgin6.four.beans.WithBeansApplication"
}

tasks.named('test') {
    useJUnitPlatform()
}
