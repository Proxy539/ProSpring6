plugins {
    id 'java'
}

group = 'com.apress.prospring6'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':chapter07')

    implementation 'org.springframework:spring-context:7.0.8'
    implementation 'org.springframework:spring-core:7.0.8'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    implementation 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'

    // Hibernate + JPA
    implementation 'org.springframework:spring-orm:7.0.8'
    implementation 'org.hibernate.orm:hibernate-core:7.4.0.Final'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'

    // MariaDB JDBC driver
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.1'

    testImplementation libs.junit.jupiter
    testImplementation 'org.springframework:spring-test:7.0.8'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mariadb'
}

tasks.named('test') {
    useJUnitPlatform()
}
