plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

apply plugin: 'kotlin'
apply plugin: 'kotlin-spring'
apply plugin: 'kotlin-jpa'

description 'Chapter 16 Kotlin: REST API with Spring Data JPA and GraphQL, in Kotlin'

group = 'com.apress.prospring6'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-restclient'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.1.20'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'

    runtimeOnly "org.mariadb.jdbc:mariadb-java-client:$mariadbClientVersion"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
}

tasks.named('test') {
    useJUnitPlatform()
}

compileKotlin {
    kotlinOptions.jvmTarget = '19'
}

compileTestKotlin {
    kotlinOptions.jvmTarget = '19'
}

bootJar {
    manifest {
        attributes 'Start-Class': 'com.apress.prospring6.sixteen.kotlin.boot.Chapter16KotlinApplicationKt'
    }
}
