services:
  mariadb:
    image: mariadb:11.4
    container_name: prospring6-ch17-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: prospring6
      MARIADB_DATABASE: webdb
      MARIADB_USER: prospring6
      MARIADB_PASSWORD: prospring6
    ports:
      - "3308:3306"
    volumes:
      - prospring6-ch17-mariadb-data:/var/lib/mysql
      - ./docker-build/scripts:/docker-entrypoint-initdb.d

volumes:
  prospring6-ch17-mariadb-data:
